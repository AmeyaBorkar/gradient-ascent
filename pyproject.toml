[project]
name = "ringtrace"
version = "0.1.0"
description = "Fraud-ring detection pipeline for the UPI Fraud Rings datathon (12-class macro-F1)."
authors = [{name = "Ameya Borkar"}]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "polars>=1.20",
    "pyarrow>=15",
    "xgboost>=2.1",
    "catboost>=1.2",
    "lightgbm>=4.0",
    "scikit-learn>=1.5",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
